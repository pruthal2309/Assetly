version: '3.8'

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try{rs.status().ok}catch(e){rs.initiate().ok}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://mongo:27017/assetly?replicaSet=rs0
      USE_TRANSACTIONS: "true"
      JWT_ACCESS_SECRET: change_me_access_secret_key_assetly_2026
      JWT_ACCESS_TTL: 15m
      REFRESH_TTL_DAYS: 7
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_BASE_URL: http://localhost:8000
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mongo_data: {}
